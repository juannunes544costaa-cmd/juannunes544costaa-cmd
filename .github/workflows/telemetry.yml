name: JARVIS Telemetry
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/terminal.svg'
      - '.github/workflows/telemetry.yml'
permissions:
  contents: read
concurrency:
  group: jarvis-telemetry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 -c "import pathlib, xml.etree.ElementTree as E; [E.parse(p) for p in pathlib.Path('assets').glob('*.svg')]"
  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public telemetry
        run: python3 scripts/update_stats.py
      - name: Commit dashboards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/telemetry.svg assets/radar.svg assets/activity.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public telemetry'
            git push
          fi
