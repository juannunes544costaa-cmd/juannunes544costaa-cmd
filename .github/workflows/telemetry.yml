name: JARVIS Telemetry
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_stats.py'
      - '.github/workflows/telemetry.yml'
permissions:
  contents: write
concurrency:
  group: jarvis-telemetry
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public telemetry
        run: python3 scripts/update_stats.py
      - name: Commit dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/telemetry.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public telemetry'
            git push
          fi
